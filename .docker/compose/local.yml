name: archetype_local

services:
  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ../nginx/dev/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: always

  app:
    build:
      context: ../..
      dockerfile: .docker/app/Dockerfile
    container_name: app
    env_file: ../environments/local.env
    expose:
      - "8080"
    restart: always